<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CERO-13 — Care Ethics AI</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f3ee;color:#20231f;margin:0}
main{max-width:820px;margin:0 auto;padding:42px 20px}.card{background:white;border:1px solid #ddd8ce;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0000000d}
h1{font-size:2.2rem;margin:.1em 0}.tag{font-size:1.1rem;color:#596158;margin-bottom:24px}
textarea{width:100%;min-height:180px;box-sizing:border-box;border:1px solid #aaa;border-radius:12px;padding:14px;font:inherit}
button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#222;color:white;font-weight:650;cursor:pointer}
#out{white-space:pre-wrap;line-height:1.55;margin-top:24px;border-top:1px solid #eee;padding-top:20px}
.small{font-size:.88rem;color:#666;margin-top:22px}
</style></head><body><main><div class="card">
<h1>CERO-13</h1><div class="tag">Care Ethics AI — human-centered problem solving through 13 principles of care.</div>
<label for="problem"><b>What problem or decision would you like to examine?</b></label>
<textarea id="problem" placeholder="Describe the situation, the people involved, and what you are deciding..."></textarea>
<button id="go">Show CERO-13 analysis</button><div id="out"></div>
<div class="small">CERO-13 is a deliberation aid, not a moral authority. It is designed to preserve human choice and does not replace professional advice.</div>
</div></main>
<script>
const go=document.getElementById("go"), out=document.getElementById("out");
go.onclick=async()=>{const problem=document.getElementById("problem").value.trim(); if(!problem)return;
go.disabled=true; out.textContent="Analyzing…";
try{const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({problem})});
const j=await r.json(); out.textContent=j.answer||("Error: "+j.error)}catch(e){out.textContent="Error: "+e.message}
finally{go.disabled=false}};
</script></body></html>
